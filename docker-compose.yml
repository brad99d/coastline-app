services:
  db:
    image: postgis/postgis:16-3.4
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - webnet
    volumes:
      - postgis_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - webnet
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgis://postgres:postgres@db:5432/db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - webnet
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: npm run dev

volumes:
  postgis_data:

networks:
  webnet: